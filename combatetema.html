<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanziito | Combates e Temas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .custom-player {
            background: #141414;
            border: 1px solid #222;
            padding: 22px 25px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            color: #fff;
            margin-bottom: 20px;
        }
        .player-top { display: flex; justify-content: space-between; align-items: center; }
        .player-top h3 { font-family: 'Syne', sans-serif; font-size: 1.15rem; margin: 0; color: #fff; }
        .format-badge { font-size: 0.7rem; color: #888; background: #1f1f1f; padding: 4px 8px; border-radius: 4px; font-weight: 600; }
        .player-controls-area { display: flex; align-items: center; gap: 15px; }
        .play-trigger {
            background: #fff; border: none; width: 38px; height: 38px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center; color: #0a0a0a; flex-shrink: 0;
            transition: transform 0.2s, background 0.2s;
        }
        .play-trigger:hover { transform: scale(1.06); background: #e0e0e0; }
        .play-trigger svg { width: 18px; height: 18px; fill: currentColor; }
        .timeline { flex: 1; height: 6px; background: #222; border-radius: 3px; cursor: pointer; position: relative; overflow: hidden; }
        .timeline-progress { width: 0%; height: 100%; background: #fff; border-radius: 3px; transition: width 0.05s linear; }
        .time-display { font-size: 0.8rem; color: #777; min-width: 75px; text-align: right; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body style="background: #0a0a0a; color: #fff; font-family: 'Inter', sans-serif;">

    <header class="hero-section" style="height: auto; min-height: 100vh;">
        <nav class="navbar">
            <a href="index.html" class="logo" style="text-decoration: none;">Sanziito</a>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="index.html">INÍCIO</a></li>
                    <li><a href="sobremim.html" data-pt="SOBRE MIM" data-en="ABOUT ME">SOBRE MIM</a></li>
                    <li><a href="faixas.html" style="color: #fff;">FAIXAS</a></li>
                    <li><a href="preços.html" data-i18n="nav-prices">PREÇOS</a></li>
                    <li><a href="equipamento.html">EQUIPAMENTOS</a></li>
                    <li><a href="contato.html">CONTATO</a></li>
                    <li><a href="termos.html">TERMOS DE SERVIÇO</a></li>
                </ul>
                <button id="lang-toggle" class="lang-btn">EN</button>
            </div>
        </nav>

        <section style="padding: 60px 20px 100px 20px; max-width: 900px; margin: 0 auto; text-align: left;">
            
            <!-- SEÇÃO: MÚSICAS DE COMBATE -->
            <div style="margin-bottom: 60px;">
                <h2 style="font-family: 'Syne', sans-serif; font-size: 2.2rem; margin-bottom: 30px; letter-spacing: 1px;">MÚSICAS DE COMBATE</h2>
                <div id="combat-container"></div>
            </div>

            <!-- SEÇÃO: MÚSICAS DE TEMAS -->
            <div>
                <h2 style="font-family: 'Syne', sans-serif; font-size: 2.2rem; margin-bottom: 20px; letter-spacing: 1px;">MÚSICAS DE TEMAS</h2>
                <p style="color: #aaa; font-size: 1.05rem; line-height: 1.7; max-width: 800px; margin-bottom: 30px;">
                    As músicas para temas são mais abrangentes e podem ser personalizadas de acordo com o personagem, ambiente ou conceito escolhido pelo comprador.
                </p>
                <!-- Container de Músicas de Tema -->
                <div id="theme-container"></div>
            </div>

        </section>
    </header>

    <script>
        // 🎵 Lista de Músicas de Combate
        const combatTracks = [
            {
                title: "Filhos do Caos - Combate (feat. BlueDespair)",
                file: "audios/filhos-do-caos-combate.mp3",
                format: "WAV"
            },
            {
                title: "Áries - Combate",
                file: "audios/aries-combate.mp3",
                format: "WAV"
            }
        ];

        // 🎵 Lista de Músicas de Tema (Vazia por enquanto, sem texto extra)
        const themeTracks = [
            // Exemplo para adicionar futuramente: 
            // { title: "Nome do Tema", file: "audios/seu-arquivo.wav", format: "WAV" }
        ];

        // Função para renderizar e ativar os players
        function renderPlaylist(tracks, containerId) {
            const container = document.getElementById(containerId);
            
            if (tracks.length === 0) {
                return; // Apenas sai e deixa limpo caso não haja faixas
            }

            tracks.forEach((track, index) => {
                const playerHTML = `
                    <div class="custom-player">
                        <div class="player-top">
                            <h3>${track.title}</h3>
                            <span class="format-badge">${track.format}</span>
                        </div>
                        <div class="player-controls-area">
                            <button class="play-trigger" title="Play/Pause">
                                <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                <svg class="icon-pause" style="display:none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                            </button>
                            <div class="timeline">
                                <div class="timeline-progress"></div>
                            </div>
                            <span class="time-display">0:00 / 0:00</span>
                        </div>
                        <audio class="audio-element" preload="metadata">
                            <source src="${track.file}" type="audio/wav">
                            Seu navegador não suporta áudio.
                        </audio>
                    </div>
                `;
                container.innerHTML += playerHTML;
            });
        }

        // Renderiza as duas seções
        renderPlaylist(combatTracks, 'combat-container');
        renderPlaylist(themeTracks, 'theme-container');

        // Mecânica global de controle de áudio (Play/Pause, Progresso e Interatividade)
        document.querySelectorAll('.custom-player').forEach(player => {
            const audio = player.querySelector('.audio-element');
            const playBtn = player.querySelector('.play-trigger');
            const iconPlay = player.querySelector('.icon-play');
            const iconPause = player.querySelector('.icon-pause');
            const timeline = player.querySelector('.timeline');
            const progress = player.querySelector('.timeline-progress');
            const timeDisplay = player.querySelector('.time-display');

            function formatTime(seconds) {
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = Math.floor(seconds % 60);
                return `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
            }

            audio.addEventListener('loadedmetadata', () => {
                timeDisplay.textContent = `0:00 / ${formatTime(audio.duration)}`;
            });

            playBtn.addEventListener('click', () => {
                document.querySelectorAll('.audio-element').forEach(otherAudio => {
                    if (otherAudio !== audio && !otherAudio.paused) {
                        otherAudio.pause();
                        const otherPlayer = otherAudio.closest('.custom-player');
                        otherPlayer.querySelector('.icon-play').style.display = 'block';
                        otherPlayer.querySelector('.icon-pause').style.display = 'none';
                    }
                });

                if (audio.paused) {
                    audio.play();
                    iconPlay.style.display = 'none';
                    iconPause.style.display = 'block';
                } else {
                    audio.pause();
                    iconPlay.style.display = 'block';
                    iconPause.style.display = 'none';
                }
            });

            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    const percentage = (audio.currentTime / audio.duration) * 100;
                    progress.style.width = `${percentage}%`;
                    timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
                }
            });

            timeline.addEventListener('click', (e) => {
                if (audio.duration) {
                    const rect = timeline.getBoundingClientRect();
                    const clickPosition = (e.clientX - rect.left) / timeline.offsetWidth;
                    audio.currentTime = clickPosition * audio.duration;
                }
            });

            audio.addEventListener('ended', () => {
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
                progress.style.width = '0%';
            });
        });
    </script>
</body>
</html>
